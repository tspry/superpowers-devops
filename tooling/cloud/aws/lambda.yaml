---
# Minimal Lambda function configuration
# Supply an artifact, handler, and exact DynamoDB table ARN for the selected runtime.
AWSTemplateFormatVersion: "2010-09-09"
Description: "Lambda function with explicit deployment and data inputs"

Parameters:
  Runtime:
    Type: String
    Default: nodejs22.x
    AllowedValues:
      - nodejs22.x
      - python3.12
      - python3.13
    Description: Lambda runtime identifier
  Handler:
    Type: String
    MinLength: 1
    Description: Runtime-compatible function handler
  MemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 32768
    Description: Memory in MB
  Timeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Function timeout in seconds
  S3Bucket:
    Type: String
    MinLength: 3
    Description: Existing S3 bucket containing the deployment package in this region
  S3Key:
    Type: String
    MinLength: 1
    Description: S3 key of the deployment package
  TableArn:
    Type: String
    MinLength: 1
    AllowedPattern: "^arn:[^:]+:dynamodb:[^:]+:[0-9]{12}:table/.+$"
    Description: Exact DynamoDB table ARN used by this function

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-lambda-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !Ref TableArn
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt FunctionRole.Arn
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Environment:
        Variables:
          LOG_LEVEL: info
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
