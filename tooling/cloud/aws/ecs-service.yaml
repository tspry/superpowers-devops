---
# CloudFormation-compatible minimal ECS service + task definition
# Supply existing cluster, IAM roles, log group, security groups and private subnets.
AWSTemplateFormatVersion: "2010-09-09"
Description: "ECS service and task definition for my-app"

Parameters:
  ClusterArn:
    Type: String
    Description: ARN of an existing ECS cluster in this region
  ExecutionRoleArn:
    Type: String
    Description: Existing execution role with image-pull and CloudWatch Logs permissions
  TaskRoleArn:
    Type: String
    Description: Existing least-privilege role used by the application
  LogGroupName:
    Type: String
    Description: Existing CloudWatch Logs group in this region
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Existing security groups permitting required application traffic
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in the security groups' VPC, with NAT or VPC endpoints for image pulls and logs
  ServiceName:
    Type: String
    Default: my-app
    Description: Name of the ECS service and task definition family
  ContainerImage:
    Type: String
    Default: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:v1.0.0
    Description: Existing image URI pinned by digest or registry-enforced immutable tag
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the container listens on
  CpuUnits:
    Type: String
    Default: "256"
    Description: Task-level CPU units
  MemoryMiB:
    Type: String
    Default: "512"
    Description: Task-level memory in MiB
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CpuUnits
      Memory: !Ref MemoryMiB
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Name
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Environment

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterArn
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 2
      DeploymentController:
        Type: ECS
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: !Ref SecurityGroupIds
          Subnets: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Environment
