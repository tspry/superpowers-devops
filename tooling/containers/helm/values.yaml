# -- Number of replicas to run
replicaCount: 2

# -- Container image configuration
image:
  repository: ghcr.io/my-org/my-app
  # -- Enforce registry tag immutability for the selected version; never use :latest
  tag: v1.0.0
  pullPolicy: IfNotPresent

# -- Create a dedicated account, or set create=false and name to an existing account.
serviceAccount:
  create: true
  name: ""

# -- Pod-level security context (applies to all containers)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (applies per container)
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Generic baseline: CPU/memory requests and a memory limit. Add a CPU limit only when workload measurements and platform policy require it.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# -- Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP

# -- Ingress is disabled until the target controller, DNS, TLS secret, and certificate owner are confirmed.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# -- Probes
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 2

# -- Additional environment variables (if any)
env: []
#  - name: LOG_LEVEL
#    value: info

# -- Additional volumes and mounts for writable paths on readOnlyRootFilesystem
extraVolumes: []
#  - name: tmp
#    emptyDir: {}
extraVolumeMounts: []
#  - name: tmp
#    mountPath: /tmp
